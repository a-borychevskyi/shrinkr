[project]
name = "url-shortner"
version = "0.1.0"
description = "A simple URL shortener built with FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.135.3",
    "greenlet>=3.3.2",
    "isort>=8.0.1",
    "loguru>=0.7.3",
    "asyncpg>=0.30.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.43.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "gunicorn>=25.3.0",
]

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "ruff>=0.15.9",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = ["src/main.py", "src/config/*", "src/orm/*", "src/repositories/*", "alembic/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.mypy]
files = ["src"]
