[project]
name = "shrinkr"
version = "0.1.0"
description = "A simple URL shortener built with FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.135.3",
    "greenlet>=3.3.2",
    "isort>=8.0.1",
    "structlog>=24.1.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.43.0",
    "gunicorn>=25.3.0",
    "redis>=7.4.0",
    "orjson>=3.11.8",
    "opentelemetry-api>=1.33.0",
    "opentelemetry-sdk>=1.33.0",
    "opentelemetry-exporter-otlp>=1.33.0",
    "opentelemetry-instrumentation-fastapi>=0.54b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.54b0",
    "opentelemetry-instrumentation-redis>=0.54b0",
    "confluent-kafka>=2.5.0",
    "starlette>=0.40.0",
    "prometheus-client>=0.21.0",
    "pyroscope-io>=0.8.0; sys_platform != 'win32'",
]

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "pre-commit>=4.2.0",
    "ruff>=0.15.9",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "testcontainers[postgres,redis,kafka]>=4.0.0",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.0.0",
    "sphinx>=9.1.0",
    "sphinx-autodoc2>=0.5.0",
    "sphinxcontrib-mermaid>=2.0.1",
]
load = [
    "locust>=2.31.0",
    "prometheus-client>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = [
    "src/main.py",
    "src/telemetry.py",
    "src/config/*",
    "src/orm/metrics.py",
    "src/orm/database.py",
    "src/utils/types/*",
    "alembic/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.mypy]
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "confluent_kafka.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "prometheus_client.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "opentelemetry.*"
ignore_missing_imports = true
