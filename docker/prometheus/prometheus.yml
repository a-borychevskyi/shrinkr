global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus-observer'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'shrinkr'
    scrape_interval: 5s
    static_configs:
      - targets: ['otel-collector:8889']
  - job_name: 'loki-observer'
    scrape_interval: 5s
    static_configs:
      - targets: ['loki-app:3100']
  - job_name: 'locust'
    scrape_interval: 5s
    static_configs:
      - targets: ['locust:9646']
