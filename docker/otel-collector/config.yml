receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 5s

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  prometheus:
    endpoint: 0.0.0.0:8889
    # Resource attributes (service.instance.id, env, role, …) become
    # Prometheus labels. Without this, all gunicorn workers collapse
    # into a single time series whose value appears to reset every
    # time a different worker exports, and rate() reports 10–20× too
    # low. With it, each worker is its own series and sum() works.
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
