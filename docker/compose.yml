services:
  the-app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: the-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - APP_ENVIRONMENT=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=url_shortener
      - DB_USER=admin
      - DB_PASSWORD=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - APP_PREFIX=shrinkr
      - OTEL_ENABLED=true
      - OTEL_SERVICE_NAME=shrinkr
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - WEB_CONCURRENCY=8
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_CLICKS_TOPIC=clicks
      - PYROSCOPE_ENABLED=true
      - PYROSCOPE_SERVER_ADDRESS=http://pyroscope:4040
      - PYROSCOPE_SAMPLE_RATE=100
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      otel-collector:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - monitoring

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: shrinkr-worker
    restart: unless-stopped
    command: ["python", "-m", "src.worker.main"]
    environment:
      - APP_HOST=0.0.0.0
      - APP_ENVIRONMENT=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=url_shortener
      - DB_USER=admin
      - DB_PASSWORD=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - APP_PREFIX=shrinkr
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_CLICKS_TOPIC=clicks
      - KAFKA_CONSUMER_GROUP=click-ingester-group
      - WORKER_HTTP_PORT=8001
      - OTEL_ENABLED=true
      - OTEL_SERVICE_NAME=shrinkr-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - PYROSCOPE_ENABLED=true
      - PYROSCOPE_SERVER_ADDRESS=http://pyroscope:4040
      - PYROSCOPE_SAMPLE_RATE=100
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_started
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - monitoring

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - monitoring

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./otel-collector/config.yml:/etc/otelcol/config.yml
    ports:
      - "4317:4317"
      - "8889:8889"
    depends_on:
      - jaeger
    networks:
      - monitoring

  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
    networks:
      - monitoring

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data
    networks:
      - monitoring

  prometheus-app:
    image: prom/prometheus:latest
    restart: unless-stopped
    container_name: prometheus-observer
    ports:
      - 9090:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring

  grafana:
    image: grafana/grafana
    container_name: grafana-observer
    restart: unless-stopped
    depends_on:
      - prometheus-app
      - loki-app
    ports:
      - 3000:3000
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - monitoring

  # No depends_on wiring: the app/worker push profiles fire-and-forget, so
  # their startup must not block on Pyroscope readiness.
  pyroscope:
    image: grafana/pyroscope:latest
    container_name: pyroscope
    restart: unless-stopped
    ports:
      - "4040:4040"
    volumes:
      - pyroscope-data:/data
    networks:
      - monitoring

  loki-app:
    image: grafana/loki:latest
    container_name: loki-observer
    restart: unless-stopped
    ports:
      - 3100:3100
    volumes:
      - ./loki/config.yml:/etc/loki/config.yaml
    networks:
      - monitoring

  promtail-app:
    image: grafana/promtail:latest
    container_name: promtail-observer
    restart: unless-stopped
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yaml  # Mount the Promtail config file
      - /var/run/docker.sock:/var/run/docker.sock # Mount the Docker socket
    command: [ "-config.file=/etc/promtail/config.yaml" ]
    depends_on: # Ensure loki is available before promtail starts
      - loki-app
    networks:
      - monitoring

  # Locust runs in distributed mode: one master (UI + stats + Prometheus
  # endpoint) and N worker processes generating the actual load. Python's
  # GIL caps a single locust process at ~1 core — at high QPS the client
  # was CPU-bound on itself, not on the app. Workers spread load across
  # cores; scale them with:
  #   docker compose --profile load up -d --scale locust-worker=4
  locust:
    build:
      context: ..
      dockerfile: docker/locust.Dockerfile
    container_name: locust
    profiles: ["load"]
    command: ["--master", "--host", "http://the-app:8000"]
    ports:
      - "8089:8089"   # Locust web UI
      - "9646:9646"   # Prometheus metrics
    depends_on:
      - the-app
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

  locust-worker:
    build:
      context: ..
      dockerfile: docker/locust.Dockerfile
    profiles: ["load"]
    command: ["--worker", "--master-host", "locust"]
    depends_on:
      - locust
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

  postgres:
    image: postgres:18.0-alpine
    restart: always
    command: ["postgres", "-c", "max_connections=500"]
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: url_shortener
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - monitoring

  kafka:
    image: apache/kafka:3.7.1
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      # KRaft mode — single-node combined controller+broker, no Zookeeper.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      # Single-node cluster: shrink replication factors so internal topics can be created.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: shrinkr-kraft-cluster-0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - monitoring

volumes:
  postgres-data:
  redis-data:
  redisinsight-data:
  kafka-data:
  pyroscope-data:

networks:
  monitoring:
    driver: bridge